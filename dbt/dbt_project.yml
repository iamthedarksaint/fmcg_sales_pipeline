name: 'fmcg_pipeline'
version: '1.0.0'
config-version: 2

profile: 'fmcg_pipeline'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  fmcg_pipeline:
    staging:
      +materialized: table
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
    gold:
      +materialized: view
      +schema: gold